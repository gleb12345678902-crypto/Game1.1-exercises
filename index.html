<script type="text/plain" id="botsrc">/* Фрактальные крестики-нолики: движок и боты.
   Глубина D: 1 = обычное поле 3×3, 2 = поле 9×9, 3 = полная партия 27×27.
   Правила (как в игре): draw, abo, lines, classic. Работает в браузере (window.FractalBots), в Web Worker и в Node. */
(function(root){
'use strict';
const Lw=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const P9=[1,9,81,729,6561];
const cnt=(a,o,n,p)=>{let c=0;for(let i=o;i<o+n;i++)if(a[i]===p)c++;return c;};
const cmp=(x,y)=>x>y?1:y>x?2:0;
function lineOf(a,o,p){for(let l=0;l<8;l++){const L=Lw[l];if(a[o+L[0]]===p&&a[o+L[1]]===p&&a[o+L[2]]===p)return true;}return false;}
const now=()=>(typeof performance!=='undefined'?performance.now():Date.now());

function Engine(D,rules){
  rules=Object.assign({draw:0,abo:0,lines:0,classic:0},rules||{});
  const E={D,rules,N:P9[D]};
  const lvl=(s,j)=>j===0?s.c:s.own[j];
  E.newState=()=>{const own=[null];for(let k=1;k<=D;k++)own.push(new Uint8Array(P9[D-k]));return{c:new Uint8Array(P9[D]),own,turn:1,last:-1,over:0,n:0};};
  E.clone=s=>({c:s.c.slice(),own:s.own.map(a=>a&&a.slice()),turn:s.turn,last:s.last,over:s.over,n:s.n});
  function fieldWin(s,k,f,p){
    const a=lvl(s,k-1);
    if(k===1)return lineOf(a,f*9,p);
    return(!rules.classic&&cnt(a,f*9,9,p)>=5)||((rules.lines||rules.classic)&&lineOf(a,f*9,p));
  }
  function fieldTie(s,k,f){
    if(!rules.draw)return 3;
    const a=lvl(s,k-1);
    let w=cmp(cnt(a,f*9,9,1),cnt(a,f*9,9,2));
    if(!w&&rules.abo&&k>=2){for(let j=k-2;j>=0&&!w;j--){const len=P9[k-j],off=f*len,b=lvl(s,j);w=cmp(cnt(b,off,len,1),cnt(b,off,len,2));}}
    return w||3;
  }
  E.region=s=>{let k=D,f=0;if(s.last>=0){for(let kk=D-1;kk>=1;kk--){const d=((s.last/P9[kk-1])|0)%9,ch=f*9+d;if(s.own[kk][ch]===0){f=ch;k=kk;}else break;}}return[k,f];};
  E.legal=s=>{
    const out=[];if(s.over)return out;
    const[k,f]=E.region(s),lo=f*P9[k],hi=lo+P9[k],c=s.c;
    for(let i=lo;i<hi;i++){
      if(c[i])continue;
      let ok=true;
      for(let j=1;j<k;j++){if(s.own[j][(i/P9[j])|0]!==0){ok=false;break;}}
      if(ok)out.push(i);
    }
    return out;
  };
  E.play=(s,i)=>{
    const p=s.turn;s.c[i]=p;s.last=i;s.n++;
    if(D===1){if(lineOf(s.c,0,p))s.over=p;}
    else{
      let f=(i/9)|0,nb=0;
      if(lineOf(s.c,f*9,p))s.own[1][f]=nb=p;
      else if(cnt(s.c,f*9,9,0)===0)s.own[1][f]=nb=fieldTie(s,1,f);
      for(let k=2;k<=D&&nb;k++){
        f=(f/9)|0;
        if(k<D){
          const o=nb;let nn=0;
          if(o<3&&fieldWin(s,k,f,o))nn=o;
          else if(cnt(s.own[k-1],f*9,9,0)===0)nn=fieldTie(s,k,f);
          if(nn)s.own[k][f]=nn;nb=nn;
        }else if(nb<3&&fieldWin(s,D,0,nb))s.over=nb;
      }
    }
    s.turn=3-p;
    if(!s.over&&E.legal(s).length===0)s.over=fieldTie(s,D,0);
  };
  return E;
}

function create(D,rules){
  const E=Engine(D,rules);
  const W=[0];for(let k=1;k<D;k++)W[k]=30/Math.pow(10,D-1-k);
  const U=D===1?1:W[1];               // ценность среднего поля
  const TW=D===1?1:U*0.25;            // вес угрозы
  const own=(s,k,p)=>cnt(s.own[k],0,s.own[k].length,p);
  function openMid(s,f){
    if(D===1)return !s.over;
    if(s.own[1][f]!==0)return false;
    for(let k=2;k<D;k++)if(s.own[k][(f/P9[k-1])|0]!==0)return false;
    return true;
  }
  function evalPos(s,me){
    if(s.over)return s.over===me?1e6:s.over===3?0:-1e6;
    const op=3-me;let v=0;
    for(let k=1;k<D;k++)v+=W[k]*(own(s,k,me)-own(s,k,op));
    const n1=P9[D-1],c=s.c;
    for(let f=0;f<n1;f++){
      if(!openMid(s,f))continue;
      const o=f*9;
      for(let l=0;l<8;l++){
        const L=Lw[l],a=c[o+L[0]],b=c[o+L[1]],d=c[o+L[2]];
        let m=0,q=0,e=0;
        if(a===me)m++;else if(a===op)q++;else e++;
        if(b===me)m++;else if(b===op)q++;else e++;
        if(d===me)m++;else if(d===op)q++;else e++;
        if(m===2&&e===1)v+=TW;else if(q===2&&e===1)v-=TW;
        else if(m===1&&e===2)v+=TW*0.12;else if(q===1&&e===2)v-=TW*0.12;
      }
      if(c[o+4]===me)v+=TW*0.3;else if(c[o+4]===op)v-=TW*0.3;
    }
    return v;
  }
  function completes(s,i,p){const c=s.c,b=((i/9)|0)*9;c[i]=p;const r=lineOf(c,b,p);c[i]=0;return r;}
  function score1(s,i){
    const p=s.turn,op=3-p,t=E.clone(s);E.play(t,i);
    if(t.over===p)return 1e6;
    if(t.over===3)return 0;
    let sc=0;
    for(let k=1;k<D;k++)sc+=W[k]*(own(t,k,p)-own(s,k,p));
    if(completes(s,i,op))sc+=U*0.8;
    return sc;
  }
  function oppGain(t){
    // лучший немедленный выигрыш соперника после хода (t: позиция, ходит соперник)
    const q=t.turn,ms=E.legal(t);let best=0;
    for(const j of ms){
      const u=E.clone(t);E.play(u,j);
      if(u.over===q)return 1e6;
      let g=0;for(let k=1;k<D;k++)g+=W[k]*(own(u,k,q)-own(t,k,q));
      if(g>best)best=g;
    }
    return best;
  }
  const pick=(arr,rng)=>arr[(rng()*arr.length)|0];
  function topBy(ms,f,n){const sc=ms.map(m=>[f(m),m]);sc.sort((a,b)=>b[0]-a[0]);return sc.slice(0,n);}

  // уровень 0: случайный ход
  function bot0(s,o){return pick(E.legal(s),o.rng);}
  // уровень 1: жадный, смотрит на один ход, с шумом
  function bot1(s,o){
    const ms=E.legal(s);let best=-1e18,bm=ms[0];
    for(const m of ms){const v=score1(s,m)+o.rng()*U*2.5;if(v>best){best=v;bm=m;}}
    return bm;
  }
  // уровень 2: жадный плюс осторожность: не отдаёт сопернику немедленный выигрыш
  function bot2(s,o){
    const ms=E.legal(s),top=topBy(ms,m=>score1(s,m)+o.rng()*U*0.6,14);
    let best=-1e18,bm=top[0][1];
    for(const[v,m]of top){
      const t=E.clone(s);E.play(t,m);
      const pen=t.over?0:oppGain(t);
      const val=v-pen*0.95;
      if(val>best){best=val;bm=m;}
    }
    return bm;
  }
  // уровень 3: два хода вперёд по оценке позиции
  function bot3(s,o){
    const me=s.turn,ms=E.legal(s),top=topBy(ms,m=>score1(s,m),16);
    let best=-1e18,bm=top[0][1];
    for(const[,m]of top){
      const t=E.clone(s);E.play(t,m);
      let worst=evalPos(t,me);
      if(!t.over){
        worst=1e18;
        for(const j of E.legal(t)){const u=E.clone(t);E.play(u,j);const v=evalPos(u,me);if(v<worst)worst=v;}
      }
      worst+=o.rng()*U*0.3;
      if(worst>best){best=worst;bm=m;}
    }
    return bm;
  }
  // уровень 4: альфа-бета с углублением по времени
  function order(s,ms,lim){
    const p=s.turn,op=3-p;
    const sc=ms.map(m=>[(completes(s,m,p)?10:0)+(completes(s,m,op)?6:0)+((m%9)===4?0.5:0),m]);
    sc.sort((a,b)=>b[0]-a[0]);
    return sc.slice(0,lim).map(x=>x[1]);
  }
  function bot4(s,o){
    const t0=now(),limit=o.time||800,dead=t0+limit;
    const me=s.turn;let rootMs=topBy(E.legal(s),m=>score1(s,m)+o.rng()*0.01,22).map(x=>x[1]);
    if(rootMs.length===1)return rootMs[0];
    let bestMove=rootMs[0],timeout=false;
    function nega(st,depth,alpha,beta){
      if(st.over||depth===0)return evalPos(st,st.turn);
      if(now()>dead){timeout=true;return 0;}
      const ms=order(st,E.legal(st),depth>=3?12:9);
      let best=-1e18;
      for(const m of ms){
        const u=E.clone(st);E.play(u,m);
        const v=-nega(u,depth-1,-beta,-alpha);
        if(timeout)return 0;
        if(v>best)best=v;
        if(best>alpha)alpha=best;
        if(alpha>=beta)break;
      }
      return best;
    }
    for(let depth=1;depth<=8;depth++){
      let alpha=-1e18,bm=rootMs[0],done=true;
      for(const m of rootMs){
        const u=E.clone(s);E.play(u,m);
        const v=-nega(u,depth-1,-1e18,-alpha);
        if(timeout){done=false;break;}
        if(v>alpha){alpha=v;bm=m;}
      }
      if(!done)break;
      bestMove=bm;
      rootMs=[bm].concat(rootMs.filter(x=>x!==bm));
      if(Math.abs(alpha)>9e5)break;
    }
    return bestMove;
  }
  // уровень 5: поиск Монте-Карло (MCTS) с осмысленными розыгрышами
  function rollout(st,me,rng){
    for(let ply=0;ply<70&&!st.over;ply++){
      const ms=E.legal(st);if(!ms.length)break;
      const p=st.turn,op=3-p;
      let mv=-1;
      const w=[],b=[];
      const n=Math.min(ms.length,16),off=(rng()*ms.length)|0;
      for(let q=0;q<n;q++){const m=ms[(off+q)%ms.length];if(completes(st,m,p))w.push(m);else if(completes(st,m,op))b.push(m);}
      if(w.length&&rng()<0.9)mv=pick(w,rng);
      else if(b.length&&rng()<0.6)mv=pick(b,rng);
      else mv=ms[(rng()*ms.length)|0];
      E.play(st,mv);
    }
    if(st.over)return st.over===me?1:st.over===3?0.5:0;
    const v=evalPos(st,me)/((W[D-1]||10)*1.6);
    return 1/(1+Math.exp(-v));
  }
  function bot5(s,o){
    const t0=now(),limit=o.time||2500,me=s.turn,rng=o.rng;
    const all=E.legal(s);
    let cands=topBy(all,m=>score1(s,m),Math.min(all.length,26)).map(x=>x[1]);
    // отсеять ходы, после которых соперник выигрывает партию сразу
    const safe=cands.filter(m=>{const t=E.clone(s);E.play(t,m);if(t.over)return t.over!==3-me;return oppGain(t)<1e5;});
    if(safe.length)cands=safe;
    for(const m of cands){const t=E.clone(s);E.play(t,m);if(t.over===me)return m;}
    if(cands.length===1)return cands[0];
    const rootN={ch:[],un:cands.slice(),n:0,w:0,mv:-1,par:null,pl:3-me};
    let it=0;
    while(true){
      if((it&15)===0&&now()-t0>limit)break;it++;
      let node=rootN;const st=E.clone(s);
      while(node.un.length===0&&node.ch.length&&!st.over){
        let bn=null,bv=-1,lg=Math.log(node.n+1);
        for(const c of node.ch){const v=c.w/c.n+1.1*Math.sqrt(lg/c.n);if(v>bv){bv=v;bn=c;}}
        node=bn;E.play(st,node.mv);
      }
      if(!st.over&&node.un.length){
        const k=(rng()*node.un.length)|0,mv=node.un[k];node.un[k]=node.un[node.un.length-1];node.un.pop();
        E.play(st,mv);
        const ch={ch:[],un:st.over?[]:E.legal(st),n:0,w:0,mv,par:node,pl:3-st.turn};
        node.ch.push(ch);node=ch;
      }
      const r=rollout(st,me,rng);
      for(let q=node;q;q=q.par){q.n++;q.w+=(q.pl===me?r:1-r);}
    }
    let best=null;
    for(const c of rootN.ch)if(!best||c.n>best.n)best=c;
    return best?best.mv:cands[0];
  }
  const BOTS=[bot0,bot1,bot2,bot3,bot4,bot5];
  const NAMES=['Новичок','Ученик','Любитель','Игрок','Мастер','Ультра'];
  function choose(level,s,opts){
    const o=Object.assign({rng:Math.random},opts||{});
    return BOTS[level](s,o);
  }

<script>/* Определение уровня: «лесенка» по уровням 0–5.

   Вопросов 8. Верный ответ на уровне 5 и неверный на уровне 0 уходят за край лесенки (уровень 6 и −1), чтобы оценка не прижималась к границам.

   Использование:
     const t=FractalPlacement.start(index);   // index = содержимое index.json
     t.next()   -> путь к заданию (например 'tasks/l2/count-001.json') или null, когда тест окончен
     t.answer(true|false)  // после ответа на текущее задание ("не знаю" = false)
     t.result() -> {estimate, level, lesson, bot}

function drawTheoryBoard(fig,b){
  const host=h('div');fig.appendChild(host);
  const Dd=b.D,bd=Board(host,Dd,{cell:Dd===1?42:undefined});
  const s={cells:b.cells,last:b.last!=null?b.last:-1,labels:b.labels,move:b.move,ans:b.marks||[]};
  if(b.own)s.ownMid=b.own;
  if(b.forced_mid!=null){const a=[];for(let k=0;k<9;k++)if(b.cells[b.forced_mid*9+k]==='.')a.push(b.forced_mid*9+k);s.allowed=a;}
  else if(b.own){const a=[];for(let M=0;M<9;M++)if(!b.own[M])for(let k=0;k<9;k++)if(b.cells[M*9+k]==='.')a.push(M*9+k);s.allowed=a;}
  bd.set(s);
  if(b.cap)fig.appendChild(h('div','cap',esc(b.cap)));
}

function pageRules(){
  setTitle('Правила');app.innerHTML='';
  const c=h('div','card theory');
  c.innerHTML=`<h2>Правила</h2>
<h3>Поле</h3><p>Поле 27×27 клеток. Это 9 больших полей (колонки I, II, III, ряды X, Y, Z). В каждом большом 9 средних (колонки 1, 2, 3, ряды А, Б, В). В каждом среднем 9 клеток (колонки а, б, в, ряды 1, 2, 3). Ход записывается так: IX–1А–а1, то есть большое, среднее, клетка.</p>
<h3>Куда ходить</h3><p>Первым ходит X, и первый ход можно сделать в любую клетку. Дальше соперник обязан ходить так:</p>
<p>• В то большое поле, которое соответствует месту среднего поля, куда ты пошёл (внутри его большого).</p>
<p>• В то среднее поле, которое соответствует месту клетки, на которую ты пошёл (внутри её среднего).</p>
<p>Если нужное среднее поле закрыто, можно ходить в любое открытое среднее этого большого. Если закрыто всё большое, можно ходить куда угодно.</p>
<h3>Как выигрывают (по умолчанию)</h3>
<p>• Среднее поле: линия из 3 клеток. Если все клетки заняты и линии нет, это ничья.</p>
<p>• Большое поле: захватить 5 из 9 средних. Если все средние закрыты, а 5 ни у кого нет, это ничья.</p>
<p>• Вся партия: захватить 5 из 9 больших. Если ходов не осталось, а 5 ни у кого нет, это ничья.</p>
<h3>Настройки (применяются к новой партии)</h3>
<p><b>Подсчёт ничьи.</b> Поле без победителя достаётся тому, у кого больше на своём уровне. Среднее: больше клеток. Большое: больше средних. Партия: больше больших. Выключено: ничья.</p>
<p><b>АБО.</b> Работает вместе с подсчётом ничьи. Если поровну, смотрит уровень ниже в этом же поле. Большое поле: сравнивает клетки. Партия: сравнивает средние поля, потом клетки. Если и там поровну, это ничья.</p>
<p><b>Обычные линии.</b> Большое поле выигрывается ещё и линией из 3 средних. Партия выигрывается ещё и линией из 3 больших. Что сработает раньше, то и считается.</p>
<p><b>Классика.</b> Работают только линии из 3, а «5 из 9» отключено.</p>
<h3>Как пользоваться доской</h3><p>Жёлтые клетки показывают, куда можно ходить. Последний ход обведён. Масштаб меняют кнопки «−» и «+», кнопка «К цели» прокручивает к полю, куда нужно ходить.</p>`;
  app.appendChild(c);
  setDock([lnk('Все уровни','pri','#/')]);
}
/* ---------- партия с ботом ---------- */
let botWorker=null;
function getWorker(){
  if(botWorker)return botWorker;
  try{
    const src=document.getElementById('botsrc').textContent+'\nonmessage=function(e){const m=e.data;const B=self.FractalBots.create(m.D,m.rules);postMessage({id:m.id,move:B.choose(m.level,m.state,{time:m.time})});};';
    botWorker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  }catch(e){botWorker=null;}
  return botWorker;
}
let reqId=0;
function askBot(D,rules,level,s,time){
  return new Promise(res=>{
    const w=getWorker();
    if(w){
      const id=++reqId;
      const on=e=>{if(e.data.id!==id)return;w.removeEventListener('message',on);res(e.data.move);};
      w.addEventListener('message',on);
      w.postMessage({id,D,rules,level,state:s,time});
    }else setTimeout(()=>{res(FractalBots.create(D,rules).choose(level,s,{time}));},30);
  });
}
function selectRow(form,label,opts,val){
  const w=h('div');w.style.margin='8px 0';w.appendChild(h('div','muted',label));
  const s=h('select','b');opts.forEach(([v,t])=>{const o=h('option',null,esc(t));o.value=v;s.appendChild(o);});s.value=val;w.appendChild(s);form.appendChild(w);return s;
}
function rulesBox(form){
  const rw=h('div');rw.style.margin='8px 0';rw.innerHTML='<div class="muted">Правила</div>';
  const rs={};[['draw','Подсчёт ничьи'],['abo','АБО'],['lines','Обычные линии'],['classic','Классика']].forEach(([k,t])=>{const l=h('label');l.style.display='block';const c=h('input');c.type='checkbox';c.style.marginRight='8px';rs[k]=c;l.append(c,document.createTextNode(t));rw.appendChild(l);});
  rs.abo.disabled=true;rs.draw.onchange=()=>{rs.abo.disabled=!rs.draw.checked;if(!rs.draw.checked)rs.abo.checked=false;};
  rs.classic.onchange=()=>{rs.lines.disabled=rs.classic.checked;if(rs.classic.checked)rs.lines.checked=true;};
  form.appendChild(rw);
  return()=>({draw:+rs.draw.checked,abo:+rs.abo.checked,lines:+rs.lines.checked,classic:+rs.classic.checked});
}

function startBotGame(D,level,me,rules,o){
  app.innerHTML='';
  const F=FractalBots.create(D,rules),E=F.engine;
  let s=E.newState(),hist=[],busy=false,hintCell=-1,gen=0,counted=false;
  const top=h('div','card');
  const stEl=h('div','stat'),info=h('div','muted');
  top.append(stEl,info);app.appendChild(top);
  const bhost=h('div');app.appendChild(bhost);
  const board=Board(bhost,D,{cell:D===1?56:undefined});
  const bot=DATA.index.bots[level];
  const time=bot.time_ms?(D===3?bot.time_ms:Math.round(bot.time_ms*(D===2?0.5:0.25))):0;
  const undo=btn('↶ Отмена','',()=>{if(busy||!hist.length)return;s=hist.pop();hintCell=-1;render();});
  const hint=btn('💡 Подсказка','',async()=>{if(busy||s.over||s.turn!==me)return;busy=true;render();const g=gen;const m=await askBot(D,rules,4,s,500);if(g!==gen)return;busy=false;hintCell=m;render();if(D===3)board.scrollToCell(m);});
  const fin=btn('Закончить','',()=>{gen++;if(o.lessonId){markBot(o.lessonId);}o.after?o.after():(location.hash='#/');});
  const again=btn('Ещё партия','',()=>{gen++;startBotGame(D,level,me,rules,o);});
  const next=btn('Дальше →','pri',()=>{gen++;o.after?o.after():(location.hash='#/');});
  function render(){
    const allowed=(!s.over&&!busy&&s.turn===me)?E.legal(s):[];
    const oo={cells:Array.from(s.c).map(v=>v===1?'X':v===2?'O':'.').join(''),last:s.last,allowed,onPick:i=>{if(busy||s.over||s.turn!==me||!allowed.includes(i))return;human(i);}};
    if(hintCell>=0)oo.sel=[hintCell];
    if(D>=2)oo.ownMid=Array.from(s.own[1]);
    if(D===3)oo.ownBig=Array.from(s.own[2]);
    board.set(oo);
    const pl=t=>t===1?'X':'O';
    if(s.over)stEl.textContent=(s.over===3?'Ничья':'Победил '+pl(s.over)+(s.over===me?' (ты!)':' (бот)'))+(o.lessonId?' · урок засчитан':'');
    else stEl.textContent=busy?'Бот «'+bot.name+'» думает…':'Твой ход ('+pl(me)+')';
    let sc='';
    if(D>=2){const k=D===3?2:1,a=Array.from(s.own[k]);sc=(D===3?'Больших полей: ':'Малых полей: ')+'X '+a.filter(v=>v===1).length+' : '+a.filter(v=>v===2).length+' O';}
    info.textContent='Бот: '+bot.name+(sc?' · '+sc:'');
    undo.disabled=busy||!hist.length;hint.disabled=busy||s.over||s.turn!==me;
    if(s.over){
      if(o.lessonId&&!counted){counted=true;markBot(o.lessonId);}
      setDock(o.lessonId?[next,again]:[again,btn('В меню','',()=>{location.hash='#/';})]);
    }else setDock(o.lessonId?[undo,hint,fin]:[undo,hint,btn('Новая партия','',()=>{gen++;pageBot();})]);
  }
  function human(i){hist.push(E.clone(s));hintCell=-1;E.play(s,i);render();botTurn();}
  async function botTurn(){
    if(s.over||s.turn===me)return;
    busy=true;const g=gen;render();
    const m=await askBot(D,rules,level,s,time);
    if(g!==gen)return;
    busy=false;
    if(!E.legal(s).includes(m)){render();return;}
    E.play(s,m);render();
    if(D===3&&!s.over)board.scrollToCell(m);
  }
  board.goal=()=>{if(s.last>=0)board.scrollToCell(s.last);};
  render();
  if(me===2)botTurn();
}

function route(){
  setDock([]);
  const p=location.hash.replace(/^#\/?/,'').split('/');
  window.scrollTo(0,0);
  try{
    if(!p[0])pageHome();
    else if(p[0]==='level')pageLevel(p[1]);
    else if(p[0]==='lesson')pageLesson(p[1]);
    else if(p[0]==='mix')pageMix();
    else if(p[0]==='test')pageTest();
    else if(p[0]==='rules')pageRules();
    else if(p[0]==='bot')pageBot();
    else pageHome();
  }catch(e){app.innerHTML='<div class="card">Ошибка: '+esc(e.message)+'</div>';console.error(e);}
}
